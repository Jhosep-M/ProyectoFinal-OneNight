# =============================================================================
# POS frontend — Service ClusterIP :80 (Persona 4 / Task 6)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: pos-frontend
  namespace: heladeria
  labels:
    app: pos-frontend
spec:
  selector:
    app: pos-frontend
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
