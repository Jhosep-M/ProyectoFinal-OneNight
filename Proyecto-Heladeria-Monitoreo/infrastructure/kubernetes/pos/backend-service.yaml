# =============================================================================
# POS backend — Service ClusterIP :3000 (Persona 4 / Task 6)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: pos-backend
  namespace: heladeria
  labels:
    app: pos-backend
spec:
  selector:
    app: pos-backend
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
