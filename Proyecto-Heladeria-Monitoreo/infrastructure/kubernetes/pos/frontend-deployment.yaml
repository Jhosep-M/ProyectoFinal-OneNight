# =============================================================================
# POS frontend (nginx) — Deployment (Persona 4 / Task 6)
# Imagen: pos-frontend:latest (pos/frontend/Dockerfile, stage nginx :80).
# nginx no expone /health del backend: probes sobre / (root SPA).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-frontend
  namespace: heladeria
  labels:
    app: pos-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pos-frontend
  template:
    metadata:
      labels:
        app: pos-frontend
    spec:
      containers:
        - name: pos-frontend
          image: pos-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
