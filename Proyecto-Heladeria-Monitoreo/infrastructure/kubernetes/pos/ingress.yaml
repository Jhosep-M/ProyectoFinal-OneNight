# =============================================================================
# POS — Ingress con TLS (Persona 4 / Task 6)
# Requiere Ingress Controller (p. ej. ingress-nginx) + cert-manager con
# ClusterIssuer `letsencrypt-prod` y secreto TLS `pos-tls`.
# Ajustar `host:` al dominio real.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pos-ingress
  namespace: heladeria
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pos.tu-dominio.com
      secretName: pos-tls
  rules:
    - host: pos.tu-dominio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pos-frontend
                port:
                  number: 80
