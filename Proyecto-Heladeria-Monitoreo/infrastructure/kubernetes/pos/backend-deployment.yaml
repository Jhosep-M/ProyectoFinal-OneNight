# =============================================================================
# POS backend — Deployment (Persona 4 / Task 6)
# 2 réplicas, probes sobre GET /health (confirmado en src/routes/health.js),
# resources requests/limits, env no secreto desde ConfigMap + secreto desde Secret.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-backend
  namespace: heladeria
  labels:
    app: pos-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pos-backend
  template:
    metadata:
      labels:
        app: pos-backend
    spec:
      containers:
        - name: pos-backend
          image: pos-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: pos-config
            - secretRef:
                name: pos-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
