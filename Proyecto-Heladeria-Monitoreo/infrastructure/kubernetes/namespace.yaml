# =============================================================================
# Namespaces — POS y Monitoreo aislados (Persona 4 / Task 6)
# POS -> namespace `heladeria` | Monitoreo -> namespace `monitoreo`.
# Aplicar: kubectl apply -f infrastructure/kubernetes/namespace.yaml
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: heladeria
  labels:
    app.kubernetes.io/part-of: heladeria-pos
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoreo
  labels:
    app.kubernetes.io/part-of: heladeria-monitoreo
