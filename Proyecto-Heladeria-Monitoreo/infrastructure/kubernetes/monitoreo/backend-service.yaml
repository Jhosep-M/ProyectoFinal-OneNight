# =============================================================================
# Monitoreo backend — Service ClusterIP :4000 (Persona 4 / Task 6)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: monitoreo-backend
  namespace: monitoreo
  labels:
    app: monitoreo-backend
spec:
  selector:
    app: monitoreo-backend
  type: ClusterIP
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
