# =============================================================================
# Monitoreo frontend — Service ClusterIP :80 (Persona 4 / Task 6)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: monitoreo-frontend
  namespace: monitoreo
  labels:
    app: monitoreo-frontend
spec:
  selector:
    app: monitoreo-frontend
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
