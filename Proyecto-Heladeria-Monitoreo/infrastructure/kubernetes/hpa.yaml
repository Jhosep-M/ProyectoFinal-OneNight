# =============================================================================
# HPA — ambos backends: min 2 réplicas, escala por CPU 70% (Persona 4 / Task 6)
# Requiere metrics-server en el clúster.
# Aplicar: kubectl apply -f infrastructure/kubernetes/hpa.yaml
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pos-backend-hpa
  namespace: heladeria
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pos-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: monitoreo-backend-hpa
  namespace: monitoreo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: monitoreo-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
