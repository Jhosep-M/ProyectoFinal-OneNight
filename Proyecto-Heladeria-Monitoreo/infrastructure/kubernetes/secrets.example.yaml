# =============================================================================
# Secrets (EJEMPLO con placeholders) — Persona 4 / Task 6
# NO aplicar este archivo tal cual ni subir valores reales a Git.
# En producción crear los Secrets con un gestor real, p. ej.:
#   kubectl create secret generic pos-secrets -n heladeria \
#     --from-literal=SUPABASE_URL='...' \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY='...' \
#     --from-literal=DATABASE_URL='...' \
#     --from-literal=MONITOREO_API_KEY='...' \
#     --from-literal=POS_ALERT_API_KEY='...' \
#     --from-literal=ORGANIZACION_EXTERNA_ID='...'
# O External Secrets Operator + AWS Secrets Manager (ver infrastructure/aws/).
# SUPABASE_SERVICE_ROLE_KEY = solo backend, nunca al frontend.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: pos-secrets
  namespace: heladeria
type: Opaque
stringData:
  SUPABASE_URL: "https://tu-proyecto.supabase.co"
  SUPABASE_ANON_KEY: "tu-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "solo-backend-nunca-frontend"
  DATABASE_URL: "postgresql://postgres:TU_PASSWORD@db.tu-proyecto.supabase.co:5432/postgres"
  MONITOREO_API_KEY: "tu-monitoreo-api-key"
  POS_ALERT_API_KEY: "tu-pos-alert-api-key"
  ORGANIZACION_EXTERNA_ID: "00000000-0000-0000-0000-000000000000"
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoreo-secrets
  namespace: monitoreo
type: Opaque
stringData:
  SUPABASE_URL: "https://tu-proyecto.supabase.co"
  SUPABASE_ANON_KEY: "tu-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "solo-backend-nunca-frontend"
  DATABASE_URL: "postgresql://postgres:TU_PASSWORD@db.tu-proyecto.supabase.co:5432/postgres"
  POS_ALERT_API_KEY: "tu-pos-alert-api-key"
